[project]
name = "erp-operations-agent"
version = "0.1.0"
description = "Natural-language ERP assistant over PostgreSQL with human-approved actions."
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "python-dotenv>=1.0,<2",
    "langchain-classic>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langchain-community>=0.4,<1",
    "langgraph>=1.0,<2",
    "langsmith>=0.4,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<1",
    "pip-audit>=2.7",
]

[tool.uv]
package = false
