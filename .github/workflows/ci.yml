name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for a disposable database. No test calls the real model.
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_ai
      READONLY_DATABASE_URL: postgresql+psycopg://erp_readonly:ci-readonly@localhost:5432/erp_ai
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_ai_test
      GROQ_API_KEY: not-used-by-tests
      ERP_ACCESS_KEY: ci-access-key
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create tables and the read-only login
        run: python seed.py
      - run: python -m pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reports without blocking: the fixes need the upgrade tracked in #19. Make it blocking once that lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit --progress-spinner off
