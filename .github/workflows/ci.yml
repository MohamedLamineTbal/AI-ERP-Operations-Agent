name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: erp_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Throwaway values for a disposable database. No test calls the real model.
    # The test setup creates erp_ai_test and both app logins through TEST_DATABASE_URL.
    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_ai
      DATABASE_URL: postgresql+psycopg://erp_app:ci-app@localhost:5432/erp_ai
      READONLY_DATABASE_URL: postgresql+psycopg://erp_readonly:ci-readonly@localhost:5432/erp_ai
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/erp_ai_test
      GROQ_API_KEY: not-used-by-tests
      ERP_ACCESS_KEY: ci-access-key
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --format requirements-txt --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
      - run: uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
